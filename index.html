<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ChoiceBase – Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>

<body>
    <div id="common-header"></div>
    <main class="container">
        <h1 class="mb-4">Welcome to ChoiceBase</h1>
        <div id="user-liked-resources" class="mb-5"></div>
        <div id="highlighted-resources" class="row g-3"></div>
    </main>


    <div id="common-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadFragment(id, url) {
            fetch(url)
                .then(res => res.text())
                .then(html => { document.getElementById(id).innerHTML = html; });
        }
        window.addEventListener('DOMContentLoaded', function () {
            loadFragment('common-header', '/includes/header.html');
            loadFragment('common-footer', '/includes/footer.html');
        });
    </script>
    <script src="assets/js/main.js"></script>
</body>

</html>
