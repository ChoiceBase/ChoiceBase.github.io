<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChoiceBase - Upskilling Resources</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-white shadow p-4">
    <h1 class="text-3xl font-bold text-center">ChoiceBase</h1>
    <p class="text-center text-gray-600">Curated Free Resources for Upskilling</p>
  </header>

  <nav class="flex flex-wrap justify-center gap-2 p-4">
    <button class="category-btn px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600" data-category="all">All</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="programming">Programming</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="ai-tools">AI & GPT Tools</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="jobs">Jobs</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="upskilling">Upskilling</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="dev-tools">Dev Tools</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="community">Community</button>
    <button class="category-btn px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" data-category="freelance">Freelance</button>
  </nav>

  <main class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="resourceContainer">
    <p class="text-center col-span-full text-gray-500">Select a category to load resources.</p>
  </main>

  <footer class="text-center text-gray-500 p-4 mt-8">
    © 2025 ChoiceBase. Open-source and community-powered.
  </footer>

  <script>
    const resourceContainer = document.getElementById('resourceContainer');

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const category = btn.getAttribute('data-category');
        loadCategory(category);
      });
    });

    async function loadCategory(category) {
      if (category === 'all') {
        resourceContainer.innerHTML = '<p class="text-center col-span-full text-gray-500">Please select a specific category to view resources.</p>';
        return;
      }

      const response = await fetch(`data/${category}.json`);
      if (!response.ok) {
        resourceContainer.innerHTML = '<p class="text-center col-span-full text-red-500">Failed to load resources.</p>';
        return;
      }

      const resources = await response.json();
      renderResources(resources);
    }

    function renderResources(resources) {
      resourceContainer.innerHTML = '';

      resources.forEach(item => {
        const votes = localStorage.getItem(item.id) || item.votes || 0;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-4 flex flex-col justify-between';

        card.innerHTML = `
          <div>
            <h2 class="text-xl font-semibold mb-2">${item.title}</h2>
            <p class="text-gray-600 mb-4">${item.description}</p>
          </div>
          <div class="flex items-center justify-between">
            <a href="${item.link}" target="_blank" class="text-blue-600 underline">Visit</a>
            <button onclick="vote('${item.id}')" class="bg-green-500 text-white px-3 py-1 rounded">👍 <span id="${item.id}">${votes}</span></button>
          </div>
        `;

        resourceContainer.appendChild(card);
      });
    }

    function vote(id) {
      let current = parseInt(localStorage.getItem(id) || 0);
      current++;
      localStorage.setItem(id, current);
      document.getElementById(id).innerText = current;
    }
  </script>

</body>
</html>
