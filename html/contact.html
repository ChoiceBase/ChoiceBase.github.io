  <main>
    <h1>Contact & Feedback</h1>
    <form id="feedback-form" action="https://formspree.io/f/yourformid" method="POST">
      <label for="feedback">Your Feedback:</label>
      <textarea id="feedback" name="feedback" required></textarea>
      <button type="submit">Send</button>
    </form>
    <form id="suggest-form" action="https://formspree.io/f/yourformid" method="POST">
      <label for="resource">Suggest a Resource:</label>
      <input id="resource" name="resource" required>
      <button type="submit">Suggest</button>
    </form>
  </main>
