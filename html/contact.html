<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Contact – ChoiceBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="../assets/css/custom.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <div id="common-header"></div>
  <main class="container">
    <h1 class="mb-4" style="color: var(--primary);">Contact & Feedback</h1>

    <!-- Feedback Form -->
    <div class="card mb-4" style="background: var(--bg-surface); border: 1.5px solid var(--primary);">
      <div class="card-body">
        <h3 class="mb-3" style="color: var(--primary);">Send Feedback</h3>
        <form id="feedback-form">
          <div class="mb-3">
            <label for="feedback-type" class="form-label" style="color: var(--text-main);">Type:</label>
            <select id="feedback-type" class="form-control" required
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);">
              <option value="general">General Feedback</option>
              <option value="bug">Bug Report</option>
              <option value="suggestion">Feature Suggestion</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="feedback-message" class="form-label" style="color: var(--text-main);">Your Feedback:</label>
            <textarea id="feedback-message" name="feedback" required class="form-control" rows="5"
              placeholder="Share your thoughts, report issues, or suggest improvements..."
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </form>
        <div id="feedback-success" class="alert alert-success mt-3"
          style="display: none; background: var(--highlight); color: var(--bg-main);">
          <i class="bi bi-check-circle"></i> Thank you! Your feedback has been submitted.
        </div>
        <div id="feedback-error" class="alert alert-danger mt-3" style="display: none;"></div>
      </div>
    </div>

    <!-- Resource Submission Form -->
    <div class="card mb-4" style="background: var(--bg-surface); border: 1.5px solid var(--primary);">
      <div class="card-body">
        <h3 class="mb-3" style="color: var(--primary);">Suggest a Resource</h3>
        <p style="color: var(--text-muted);">Help the community by suggesting a new resource to add to ChoiceBase.</p>
        <form id="resource-submission-form">
          <div class="mb-3">
            <label for="resource-title" class="form-label" style="color: var(--text-main);">Resource Title *</label>
            <input type="text" id="resource-title" class="form-control" required placeholder="e.g., ChatGPT"
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);">
          </div>
          <div class="mb-3">
            <label for="resource-url" class="form-label" style="color: var(--text-main);">URL *</label>
            <input type="url" id="resource-url" class="form-control" required placeholder="https://example.com"
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);">
          </div>
          <div class="mb-3">
            <label for="resource-description" class="form-label" style="color: var(--text-main);">Description *</label>
            <textarea id="resource-description" class="form-control" required rows="3"
              placeholder="Brief description of the resource..."
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);"></textarea>
          </div>
          <div class="mb-3">
            <label for="resource-category" class="form-label" style="color: var(--text-main);">Category *</label>
            <select id="resource-category" class="form-control" required
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);">
              <option value="ai-tools">AI Tools</option>
              <option value="jobs">Jobs</option>
              <option value="programming">Coding</option>
              <option value="upskilling">Upskilling</option>
              <option value="others">Others</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="resource-tags" class="form-label" style="color: var(--text-main);">Tags
              (comma-separated)</label>
            <input type="text" id="resource-tags" class="form-control" placeholder="free, chatbot, programming"
              style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--primary);">
            <small class="form-text" style="color: var(--text-muted);">Separate tags with commas</small>
          </div>
          <button type="submit" class="btn btn-primary">Submit Resource</button>
        </form>
        <div id="resource-success" class="alert alert-success mt-3"
          style="display: none; background: var(--highlight); color: var(--bg-main);">
          <i class="bi bi-check-circle"></i> Thank you! Your resource suggestion has been submitted for review.
        </div>
        <div id="resource-error" class="alert alert-danger mt-3" style="display: none;"></div>
      </div>
    </div>
  </main>
  <div id="common-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      utils.loadHeaderFooter();
    });
  </script>
  <script src="../assets/js/security.js"></script>
  <script src="../assets/js/submissions.js"></script>
  <script src="../assets/js/contact.js"></script>
</body>

</html>
