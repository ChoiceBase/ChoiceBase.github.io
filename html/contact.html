<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – ChoiceBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="common-header"></div>
  <main class="container">
    <h1 class="mb-4">Contact & Feedback</h1>
    <form id="feedback-form" action="https://formspree.io/f/yourformid" method="POST" class="mb-4">
      <label for="feedback">Your Feedback:</label>
      <textarea id="feedback" name="feedback" required class="form-control"></textarea>
      <button type="submit" class="btn btn-primary mt-2">Send</button>
    </form>
  </main>
  <div id="common-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function loadFragment(id, url) {
      fetch(url)
        .then(res => res.text())
        .then(html => { document.getElementById(id).innerHTML = html; });
    }
    window.addEventListener('DOMContentLoaded', function() {
      loadFragment('common-header', '/includes/header.html');
      loadFragment('common-footer', '/includes/footer.html');
    });
  </script>
</body>
</html>
