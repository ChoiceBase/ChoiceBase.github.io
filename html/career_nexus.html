<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Career Nexus – ChoiceBase Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/graph.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Interactive Workspace with Scrolling Intelligence */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: var(--bg);
    }

    .nexus-body {
      display: block;
      min-height: 100vh;
    }

    #graph-container {
      width: 100%;
      height: 90vh;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>

<body class="nexus-body">
  <div id="common-header"></div>

  <div id="graph-container">
    <!-- Top Floating Nexus Bar: Domain Selector + Live Search -->
    <div class="nexus-top-bar">
      <div class="domain-selector-bar">
        <a href="#software" class="nexus-domain-pill" data-domain="software">
          <i class="bi bi-laptop me-1"></i>Software IT <span class="pill-count">42</span>
        </a>
        <a href="#electronics" class="nexus-domain-pill" data-domain="electronics">
          <i class="bi bi-cpu me-1"></i>Electronics <span class="pill-count">21</span>
        </a>
        <a href="#marketing" class="nexus-domain-pill" data-domain="marketing">
          <i class="bi bi-graph-up me-1"></i>Marketing <span class="pill-count">26</span>
        </a>
        <a href="#medical" class="nexus-domain-pill" data-domain="medical">
          <i class="bi bi-heart-pulse me-1"></i>Medical <span class="pill-count">25</span>
        </a>
        <a href="#construction" class="nexus-domain-pill" data-domain="construction">
          <i class="bi bi-building me-1"></i>Construction <span class="pill-count">25</span>
        </a>
        <a href="#manufacturing" class="nexus-domain-pill" data-domain="manufacturing">
          <i class="bi bi-gear-wide me-1"></i>Manufacturing <span class="pill-count">24</span>
        </a>
      </div>

      <div class="nexus-search-box">
        <i class="bi bi-search text-muted"></i>
        <input type="text" id="nexus-search-input" placeholder="Search roles, skills, tools..." oninput="window.filterNexusGraph(this.value)">
        <button type="button" id="nexus-search-clear" onclick="document.getElementById('nexus-search-input').value=''; window.filterNexusGraph('');" title="Clear Search">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Path Status Overlay -->
    <div class="path-selector">
      <span id="path-status">Shift+Click a role to start path trace.</span>
    </div>

    <!-- Expanded Intelligence Modal -->
    <div id="intel-modal" class="intel-modal">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold mb-0">Industry Insights</h2>
        <button class="btn-close btn-close-white" onclick="window.toggleFullIntel()"></button>
      </div>
      <div id="full-intel-list">
        <!-- Full list of tools -->
      </div>
      <div class="mt-4 text-center">
        <button class="btn btn-outline-primary btn-sm rounded-pill px-4" onclick="window.toggleFullIntel()">Close
          Insights</button>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="window.zoomNexus(1.2)" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
      <button class="zoom-btn" onclick="window.zoomNexus(0.8)" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
      <button class="zoom-btn" onclick="window.resetNexusZoom()" title="Reset Zoom"><i
          class="bi bi-arrows-fullscreen"></i></button>
    </div>

    <!-- Dynamic SVG -->
    <svg id="nexus-svg"></svg>

    <!-- Floating Action Buttons (Metrics + Roadmaps) -->
    <div class="nexus-floating-actions">
      <a href="/html/roadmaps.html" class="roadmap-jump-btn" title="Explore Step-by-Step Learning Roadmaps">
        <i class="bi bi-map-fill"></i>
        <span>Skill Roadmaps</span>
      </a>
      <a href="#nexus-hub-section" class="jump-link-btn" title="View live trending tools">
        <i class="bi bi-graph-up-arrow"></i>
        <span>Industry Metrics</span>
      </a>
    </div>

    <!-- Role Details Side/Bottom Panel -->
    <div id="nexus-info-panel" class="nexus-info-side">
      <div class="info-header">
        <span class="fw-bold"><i class="bi bi-file-earmark-text me-2"></i>Role Details</span>
        <button class="btn-close btn-close-white"
          onclick="document.getElementById('nexus-info-panel').classList.remove('show')"></button>
      </div>
      <div id="info-panel-body" class="info-body">
        <!-- Content injected by JS -->
      </div>
    </div>
  </div>

  <!-- Intelligence Hub Section -->
  <div id="nexus-hub-section" class="nexus-dashboard">
    <div class="dashboard-title">
      <span>Intelligence Hub</span>
      <i class="bi bi-info-circle small"></i>
      <!-- Back to Graph (Mobile only) -->
      <a href="#graph-container" class="ms-auto text-decoration-none small fw-bold d-md-none" style="color: var(--p)">
        <i class="bi bi-arrow-up"></i> BACK TO MAP
      </a>
    </div>
    <div id="dash-list">
      <!-- Live trending tools -->
    </div>
    <a class="expand-link" onclick="window.toggleFullIntel()">EXPAND TRENDS <i class="bi bi-arrow-right"></i></a>
  </div>

  <!-- Note: Footer is hidden on this specific page to maximize workspace -->
  <div id="common-footer" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/global-search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      utils.loadHeaderFooter();
    });
  </script>
  <script src="../assets/js/graph.js"></script>
</body>

</html>
