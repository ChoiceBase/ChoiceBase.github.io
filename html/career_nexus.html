<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Multi-Domain Roles Graph</title>
  <link rel="stylesheet" href="../assets/css/graph.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="responsive-body">
  <div id="common-header"></div>

  <main class="container"></main>

  <div id="graph-container">
    <section id="construction" class="domain-section"></section>
    <section id="electronics" class="domain-section"></section>
    <section id="software" class="domain-section"></section>
    <section id="manufacturing" class="domain-section"></section>
    <section id="marketing" class="domain-section"></section>
    <section id="medical" class="domain-section"></section>
    <input id="node-search" type="text" placeholder="Search roles, skills, tools..."
      style="padding: 7px 12px; border: 1px solid #bbb; width: 260px; margin-right: 10px; font-size: 17px; border-radius: 6px;">
    <button id="search-btn"
      style="padding: 7px 18px; background: #1976d2; color: #fff; border: none; font-size: 17px; border-radius: 6px;">Search</button>
    <button id="reset-btn"
      style="padding: 7px 18px; background: #bbb; color: #222; border: none; margin-left: 10px; font-size: 17px; border-radius: 6px;">Reset</button>
    <svg width="1000" height="700"></svg>
  </div>

  <div id="details"></div>
  <div id="node-popup" class="popup" style="display:none;"></div>

  <div id="common-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      utils.loadHeaderFooter();
    });
  </script>
  <script src="../assets/js/graph.js"></script>

</body>

</html>
