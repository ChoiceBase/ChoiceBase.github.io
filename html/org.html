<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Organization Chart – ChoiceBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    /* --- Full-height flexible canvas layout --- */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #common-header { flex-shrink: 0; }

    main.org-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0 0.75rem 0.5rem;
    }

    .chart-viewport {
      position: relative;
      flex: 1 1 auto;   /* Fills ALL remaining vertical space between header and bottom */
      width: 100%;
      min-height: 200px;
      background: var(--s);
      border: 1px solid var(--br);
      border-radius: var(--r);
      overflow: hidden;
      cursor: grab;
      box-shadow: var(--sh);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .chart-viewport:active {
      cursor: grabbing;
    }

    /* Footer: hidden by default, slides in when toggled */
    #common-footer {
      flex-shrink: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    #common-footer.footer-open {
      max-height: 600px;
    }

    /* Footer toggle button — always visible at bottom-left of canvas */
    .footer-toggle-btn {
      position: absolute;
      bottom: 4.5rem;
      left: 1.5rem;
      z-index: 1001;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--br);
      border-radius: 12px;
      padding: 6px 14px;
      color: var(--tx);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--trans);
    }

    .footer-toggle-btn:hover {
      background: var(--p);
      color: white;
      border-color: var(--p);
    }

    /* Style for suggestion items */
    #org-search-suggestions .dropdown-item {
      color: var(--tx);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      white-space: normal;
    }
    #org-search-suggestions .dropdown-item:hover,
    #org-search-suggestions .dropdown-item:focus {
      background: var(--glass);
      backdrop-filter: brightness(1.2);
    }

    #chart_div {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* SVG handles its own overflow/panning */
    }

    /* Google Chart Node Styling - Removed for D3 */
    /* Controls Overlay */
    .viewport-controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 1000;
    }

    .v-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--br);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--trans);
    }

    .v-btn:hover {
      background: var(--p);
      border-color: var(--p);
      color: white;
    }

    /* Interactive Search & Breadcrumbs */
    .org-tools {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 320px;
      z-index: 1000;
    }

    .org-search {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--br);
      border-radius: 12px;
      padding: 0.5rem 1rem;
      color: var(--tx);
      width: 100%;
      outline: none;
      box-shadow: var(--sh);
    }


    .breadcrumbs-bar {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--br);
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      color: var(--tx-m);
      font-size: 0.85rem;
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow-x: auto;
      z-index: 1000;
    }

    .breadcrumbs-bar span {
      color: var(--tx);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      html, body { overflow: hidden; }

      .org-tools {
        width: calc(100% - 3rem);
      }

      .breadcrumbs-bar {
        bottom: 5rem; /* Avoid overlapping mobile controls */
        font-size: 0.75rem;
      }

      .viewport-controls {
        top: auto;
        bottom: 2rem;
        right: 1.5rem;
        flex-direction: row;
        z-index: 2000;
      }

      .v-btn {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body style="display:flex;flex-direction:column;height:100%;overflow:hidden">
  <div id="common-header" style="flex-shrink:0"></div>

  <main class="org-main">
    <div class="chart-viewport" id="viewport">
      <!-- Search & Breadcrumbs -->
      <div class="org-tools">

        <!-- Search Container with Suggestions -->
        <div class="position-relative mb-3 search-container">
          <input type="text" id="org-search-input" class="org-search" placeholder="Search roles..." autocomplete="off">
          <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3 opacity-50"></i>
          
          <!-- Dropdown container -->
          <ul id="org-search-suggestions" class="dropdown-menu w-100 shadow" style="display:none; max-height: 250px; overflow-y: auto; position: absolute; z-index: 1050; border-radius: 12px; border: 1px solid var(--br); background: var(--glass); backdrop-filter: blur(15px);"></ul>
        </div>
      </div>

      <div class="breadcrumbs-bar" id="org-breadcrumbs">
        Select a node to see hierarchy path
      </div>

      <!-- Controls -->
      <div class="viewport-controls">
        <button class="v-btn" onclick="adjustZoom(1.1)" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
        <button class="v-btn" onclick="adjustZoom(0.9)" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
        <button class="v-btn" onclick="resetView()" title="Auto Center"><i class="bi bi-arrows-fullscreen"></i></button>
        <button class="v-btn" onclick="window.exportOrgChart()" title="Print/Export"><i class="bi bi-camera"></i></button>
        <button class="v-btn" onclick="scrollToTop()" title="Back to Top"><i class="bi bi-arrow-up-short"></i></button>
        <button class="v-btn" onclick="openFooter()" title="Jump to Footer"><i class="bi bi-arrow-down-short"></i></button>
      </div>

      <div id="chart_div"></div>

    </div>
  </main>
  <div id="common-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/global-search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => Utils.loadHeaderFooter());

    const vp = document.getElementById('viewport');
    
    // Zoom & pan is now handled natively by D3 inside org.js
    // HTML buttons call window.adjustZoom -> orgChart.zoomIn()/zoomOut()

    function scrollToTop() {
      const footer = document.getElementById('common-footer');
      footer.classList.remove('footer-open');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openFooter() {
      const footer = document.getElementById('common-footer');
      footer.classList.add('footer-open');
      setTimeout(() => footer.scrollIntoView({ behavior: 'smooth', block: 'end' }), 50);
    }
  </script>
  <script src="../assets/js/org.js"></script>
</body>
</html>
