<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Organization Chart from Roles JSON</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chart_div {
            margin: 40px auto;
            width: fit-content;
            max-width: 95%;
            overflow-x: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* Optional: tooltips or role cards inside nodes */
        .google-visualization-orgchart-node {
            font-size: 14px;
            line-height: 1.4;
            padding: 6px;
            border: 1px solid #ccc !important;
            background-color: #ffffff !important;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .google-visualization-orgchart-node:hover {
            transform: scale(1.05);
            background-color: #eef6ff !important;
            border-color: #a3c4f3 !important;
        }
    </style>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body class="responsive-body">
    <div id="common-header"></div>
    <h1>Organization Chart</h1>
    <div id="chart_div"></div>

    <div id="common-footer"></div>
    <script>
      function loadFragment(id, url) {
        fetch(url).then(res => res.text()).then(html => {
          document.getElementById(id).innerHTML = html;
        });
      }
      window.addEventListener('DOMContentLoaded', function() {
        loadFragment('common-header', '/includes/header.html');
        loadFragment('common-footer', '/includes/footer.html');
      });
    </script>
    <script src="../assets/js/org.js"></script>
</body>

</html>
