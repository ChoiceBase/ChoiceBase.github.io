<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Tools – ChoiceBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for modern UI -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <!-- Common header will be loaded here -->
  <div id="common-header"></div>
  <main class="container">
    <h1 class="mb-4">AI Tools</h1>
    <!-- Filters for tags/categories -->
    <div id="filters" class="mb-3"></div>
    <!-- Resource cards grid -->
    <div id="resource-list" class="row g-3"></div>
    <!-- Pagination controls -->
    <nav id="pagination" aria-label="Page navigation" class="mt-4"></nav>
  </main>
  <!-- Common footer will be loaded here -->
  <div id="common-footer"></div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Header/Footer Loader Script -->
  <script>
    function loadFragment(id, url) {
      fetch(url)
        .then(res => res.text())
        .then(html => { document.getElementById(id).innerHTML = html; });
    }
    window.addEventListener('DOMContentLoaded', function() {
      loadFragment('common-header', '/includes/header.html');
      loadFragment('common-footer', '/includes/footer.html');
    });
  </script>
  <!-- Page-specific scripts -->
  <script>
    window.CATEGORY = "ai-tools";
  </script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/pagination.js"></script>
  <script src="../assets/js/voting.js"></script>
  <script src="../assets/js/favorites.js"></script>
  <script src="../assets/js/filters.js"></script>
</body>
</html>
