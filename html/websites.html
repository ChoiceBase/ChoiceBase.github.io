<!DOCTYPE html>
<html lang="en">

<head>
    <!-- SEO Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title id="page-title">Websites – ChoiceBase</title>
    <meta name="description"
        content="Discover curated websites for developers, designers, and tech professionals. Learning platforms, documentation, communities, and essential web resources.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://choicebase.github.io/html/websites.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Websites – ChoiceBase">
    <meta property="og:description" content="Discover curated websites for developers, designers, and tech professionals.">
    <meta property="og:url" content="https://choicebase.github.io/html/websites.html">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Websites – ChoiceBase">
    <meta name="twitter:description"
        content="Discover curated websites for developers, designers, and tech professionals.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="common-header"></div>
    <main class="container-fluid px-2 px-md-4 mt-4">
        <div class="row g-4">
            <!-- Main Content Area (Full width now that sidebar is a dropdown) -->
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h1 class="display-5 fw-bold mb-0" id="category-title">Websites</h1>

                    <div class="d-flex gap-2">
                        <!-- Sections Dropdown -->
                        <div class="dropdown sections-dropdown">
                            <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <i class="bi bi-list-task me-2"></i>Sections
                            </button>
                            <ul id="sections-dropdown-menu" class="dropdown-menu dropdown-menu-end shadow">
                                <!-- Populated by JS -->
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="resource-container" id="resource-container"></div>
                <nav id="pagination" aria-label="Page navigation" class="mt-5"></nav>
            </div>
        </div>
    </main>

    <!-- Floating Tools (Bottom Right) -->
    <div class="floating-tools">
        <button class="btn btn-floating" onclick="window.scrollTo({top: 0, behavior: 'smooth'});" title="Jump to Top">
            <i class="bi bi-chevron-up"></i>
        </button>
        <button class="btn btn-floating"
            onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});" title="Jump to Bottom">
            <i class="bi bi-chevron-down"></i>
        </button>
    </div>

    <div id="common-footer"></div>

    <!-- Shared logic & Components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <!-- Page JS -->
    <script src="/assets/js/websites.js"></script>
    <script src="/assets/js/global-search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            utils.loadHeaderFooter();
        });
    </script>
</body>

</html>
