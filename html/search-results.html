<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results – ChoiceBase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div id="common-header"></div>
    <main class="container mb-5">
        <h1 class="mb-4" id="search-title">Search Results for "<span id="search-query-display"></span>"</h1>
        <div id="search-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="search-results-container" class="resource-list" style="display: none;">
            <!-- Results will be injected here -->
        </div>
        <div id="no-results" class="text-center py-5" style="display: none;">
            <i class="bi bi-search" style="font-size: 3rem; color: #ccc;"></i>
            <h3 class="mt-3">No results found</h3>
            <p class="text-muted">Try different keywords or browse our categories.</p>
        </div>
    </main>
    <div id="common-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script src="/assets/js/global-search.js"></script>
    <script src="/assets/js/search-results.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            utils.loadHeaderFooter();
        });
    </script>
</body>

</html>
