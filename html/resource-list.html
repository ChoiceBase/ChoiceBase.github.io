<!DOCTYPE html>

<head>

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://choicebase.github.io/html/resource-list.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Resources – ChoiceBase">
    <meta property="og:description" content="Browse curated resources for AI tools, programming, jobs, and upskilling.">
    <meta property="og:url" content="https://choicebase.github.io/html/resource-list.html">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

<body>
    <div id="common-header"></div>

            <div class="dropdown sections-dropdown">

                <ul id="sections-dropdown-menu" class="dropdown-menu dropdown-menu-end">
                    <!-- Populated by JS -->
                </ul>

    <main class="container mb-5">
        <div class="row">

                <div class="resource-container" id="resource-container"></div>
                <nav id="pagination" aria-label="Page navigation" class="mt-5"></nav>
            </div>
        </div>

    <div id="common-footer"></div>

    <!-- Shared logic & Components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page JS -->
    <script src="/assets/js/resource-list.js"></script>
    <script src="/assets/js/global-search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
