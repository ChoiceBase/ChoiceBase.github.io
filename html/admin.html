<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – ChoiceBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="../assets/css/custom.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <div id="common-header"></div>
  <main class="container">
    <h1 class="mb-4" style="color: var(--primary);">Admin Panel</h1>
    <p style="color: var(--text-muted);">View top-liked resources, user feedback, and resource submissions.</p>
    
    <div id="top-liked-resources"></div>
    <div id="recent-feedback"></div>
    <div id="resource-submissions"></div>
    
    <!-- Stats Summary -->
    <div class="card mb-4" style="background: var(--bg-surface); border: 1.5px solid var(--primary);">
      <div class="card-body">
        <h3 style="color: var(--primary);">Statistics</h3>
        <div class="row">
          <div class="col-md-4">
            <div class="stat-item p-3" style="background: var(--bg-main); border-radius: 0.5em; margin: 10px 0;">
              <h4 id="total-votes" style="color: var(--highlight);">0</h4>
              <p style="color: var(--text-muted); margin: 0;">Total Votes</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-item p-3" style="background: var(--bg-main); border-radius: 0.5em; margin: 10px 0;">
              <h4 id="total-favorites" style="color: var(--highlight);">0</h4>
              <p style="color: var(--text-muted); margin: 0;">Total Favorites</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-item p-3" style="background: var(--bg-main); border-radius: 0.5em; margin: 10px 0;">
              <h4 id="total-feedback" style="color: var(--highlight);">0</h4>
              <p style="color: var(--text-muted); margin: 0;">Feedback Items</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="common-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/security.js"></script>
    <script src="../assets/js/submissions.js"></script>
    <script src="../assets/js/admin.js"></script>
  <script>
    // Update stats
    window.addEventListener('DOMContentLoaded', () => {
      const votes = JSON.parse(localStorage.getItem('votes') || '{}');
      const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
      const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
      
      const totalVotes = Object.values(votes).reduce((sum, v) => sum + v, 0);
      document.getElementById('total-votes').textContent = totalVotes;
      document.getElementById('total-favorites').textContent = favorites.length;
      document.getElementById('total-feedback').textContent = feedbacks.length;
    });
  </script>
</body>
</html>
