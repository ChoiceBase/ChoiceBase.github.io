version: '3.8'

services:
  # Production-like server (nginx)
  choicebase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: choicebase
    ports:
      - "8081:8081"
    volumes:
      # Mount for live reload during development (optional)
      - .:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - choicebase-network

  # Development server with auto-reload
  choicebase-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: choicebase-dev
    ports:
      - "8081:8081"
    volumes:
      # Mount for live reload
      - .:/app
    restart: unless-stopped
    networks:
      - choicebase-network
    profiles:
      - dev

networks:
  choicebase-network:
    driver: bridge
